<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AIquarium · Mockup</title>
<style>
  :root{
    --ink:#e8eef7; --mu:#93a0b4; --line:#22303f; --panel:rgba(10,14,20,.72);
    --accent:#38bdf8; --food:#c8a24a; --energy:#5ac8fa; --sanity:#9b7bf0; --warn:#f5a524;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05070b;color:var(--ink);font-family:var(--font);overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  .hud{position:fixed;pointer-events:none;z-index:5}
  .top{top:16px;left:18px;display:flex;flex-direction:column;gap:5px}
  .name{font-size:.92rem;letter-spacing:.01em}
  .name b{font-weight:650}
  .sub{font-family:var(--mono);font-size:.7rem;color:var(--mu)}
  .warn{color:var(--warn)}

  .bars{left:18px;bottom:18px;display:grid;gap:7px;width:224px}
  .bar{display:grid;grid-template-columns:74px 1fr 38px;align-items:center;gap:8px;font-size:.7rem;color:var(--mu)}
  .track{height:6px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .num{font-family:var(--mono);text-align:right}

  /* Treiber (Paket K): gesondert unter den Kernen, grau bis Werte da sind */
  .treiber{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);display:grid;gap:7px;opacity:.45;filter:grayscale(.7)}
  .treiber.lebt{opacity:1;filter:none}
  .treiber .titel{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
  .treiber .kommt{font-size:.56rem;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .treiber.lebt .kommt{display:none}
  .treiber .note{font-size:.6rem;color:var(--mu);font-family:var(--mono)}
  .treiber.lebt .note{display:none}

  /* Inventar: links zwischen Name und Balken, Liste mit Fund-Tick */
  .inventar{left:18px;top:110px;width:262px;max-height:calc(100vh - 400px);min-height:40px;overflow:auto;font-size:.68rem}
  .inventar h3{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
  .inventar ul{list-style:none;display:grid;gap:3px}
  .inventar li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;display:flex;gap:7px;align-items:baseline}
  .inventar .tick{font-family:var(--mono);color:var(--mu);font-size:.6rem;white-space:nowrap}
  .inventar .leer{color:var(--mu);font-family:var(--mono);font-size:.62rem;background:none;border:0;padding:0}

  /* Ein Scrollbereich für das ganze Panel — verschachtelte Flex-Höhen waren unzuverlässig */
  .feed{position:fixed;top:16px;right:16px;width:330px;max-height:calc(100% - 140px);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(8px);padding:12px;z-index:6;
    overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .feed h2{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .feed h2 button{border:0;background:transparent;color:var(--mu);opacity:.5;font-size:.9rem;line-height:1;padding:1px 6px;cursor:pointer}
  .feed h2 button:hover{opacity:1;color:var(--accent-ink,#e8eef7)}
  .feed .liste{display:grid;gap:6px;max-height:34vh;overflow-y:auto;scrollbar-width:thin}
  .eintrag{border-left:2px solid var(--line);padding:3px 0 3px 8px;font-size:.76rem;line-height:1.35}
  .eintrag small{display:block;color:var(--mu);font-family:var(--mono);font-size:.6rem}
  .eintrag.thought{border-color:var(--accent)}
  .eintrag.death{border-color:#f43f5e}
  .eintrag.spawn{border-color:#10b981}
  .eintrag.discovery{border-color:#f59e0b}
  .eintrag.mind{border-color:#9b7bf0}
  .eintrag.belief{border-color:#c8a24a}
  .eintrag.find{border-color:#6fe3b0}
  .eintrag.note{border-color:#e6e1cf}
  .eintrag.bake{border-color:#f5a524}
  .eintrag .musing{color:var(--mu);font-style:italic}
  .dev{display:none;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
    color:#04121b;background:#5ac8fa;border-radius:4px;padding:2px 5px;font-weight:700}
  .dev.an{display:inline-block;margin-left:6px;vertical-align:1px}
  /* Der Debug-Block darf die Panels nicht sprengen: eigener Scrollbereich */
  .debug{margin-top:10px;border-top:1px dashed #2b3a4d;padding-top:8px;display:none}
  .debug.an{display:block}
  #debugliste{display:grid;gap:4px}
  .debug.an{display:block}
  .debug h3{font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:#7f8fa6;margin-bottom:6px}
  .devctl{display:grid;gap:5px;margin-bottom:8px}
  .devctl label{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;gap:6px;
    font-size:.6rem;color:#9fb0c6;font-family:var(--mono)}
  .devctl input[type=range]{width:100%;height:14px;accent-color:#5ac8fa}
  .devctl .speed{display:flex;gap:4px;align-items:center;font-size:.6rem;color:#7f8fa6;
    font-family:var(--mono);margin-top:2px}
  .devctl .speed button{font:inherit;font-size:.6rem;background:transparent;color:#9fb0c6;
    border:1px solid #2b3a4d;border-radius:4px;padding:1px 6px;cursor:pointer}
  .devctl .speed button[aria-pressed="true"]{background:#5ac8fa;color:#04121b;border-color:#5ac8fa}
  .dbg{border:1px dashed #2b3a4d;border-radius:6px;padding:3px 6px;margin-bottom:4px;
    font-family:var(--mono);font-size:.6rem;line-height:1.4;color:#9fb0c6;background:rgba(90,200,250,.05)}
  .dbg b{color:#cfe3f7;font-weight:600}
  .dbg .t{color:#5ac8fa}
  .dbg .w{color:#f5a524}
  .glaube{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:.7rem;color:var(--mu);display:grid;gap:3px}
  .glaube b{color:var(--ink);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em}

  .cam{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px;z-index:7;
    backdrop-filter:blur(8px)}
  .cam button{font:inherit;font-size:.72rem;color:var(--mu);background:transparent;border:0;
    padding:6px 12px;border-radius:99px;cursor:pointer}
  .cam button:hover{color:var(--ink)}
  .cam button[aria-pressed="true"]{background:var(--accent);color:#04121b;font-weight:600}
  .hinweis{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);font-size:.64rem;
    color:#7b8a9e;font-family:var(--mono);z-index:6;pointer-events:none}

  .bubble{position:fixed;transform:translate(-50%,-100%);max-width:280px;background:#e8eef7;color:#0a0d12;
    border-radius:10px;padding:7px 11px;font-size:.79rem;line-height:1.35;z-index:8;display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .bubble:after{content:"";position:absolute;left:18px;bottom:-6px;border:6px solid transparent;border-top-color:#e8eef7}

  .fuss{position:fixed;bottom:8px;right:14px;font-size:.6rem;color:#546274;z-index:5}
  @media(max-width:820px){
    .feed{width:calc(100% - 32px);max-height:32%;top:auto;bottom:96px;left:16px;right:16px}
    .bars{width:160px;bottom:96px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud top">
  <div class="name"><span id="name">verbinde …</span> <span class="dev" id="devbadge">dev</span></div>
  <div class="sub" id="sub"></div>
</div>

<div class="hud bars">
  <div class="bar"><span>Körper</span><div class="track"><i id="b-body" style="background:var(--food);width:0"></i></div><span class="num" id="n-body">–</span></div>
  <div class="bar"><span>Psyche</span><div class="track"><i id="b-psyche" style="background:var(--sanity);width:0"></i></div><span class="num" id="n-psyche">–</span></div>
  <div class="treiber" id="treiber">
    <div class="titel">Treiber</div>
    <div class="bar"><span>Hunger</span><div class="track"><i id="b-hunger" style="background:var(--food);width:0"></i></div><span class="num" id="n-hunger">–</span></div>
    <div class="bar"><span>Temperatur</span><div class="track"><i id="b-thermo" style="background:var(--warn);width:0"></i></div><span class="num" id="n-thermo">–</span></div>
    <div class="bar"><span>Drang</span><div class="track"><i id="b-drang" style="background:var(--energy);width:0"></i></div><span class="num" id="n-drang">–</span></div>
    <div class="bar"><span>Halt</span><div class="track"><i id="b-halt" style="background:var(--accent);width:0"></i></div><span class="num" id="n-halt">–</span></div>
  </div>
</div>

<div class="hud inventar" id="inventar">
  <h3>Inventar</h3>
  <ul id="inventar-liste"><li class="leer">Noch nichts gefunden.</li></ul>
</div>

<aside class="feed" id="feedPanel">
  <h2>Feed <button id="feedAus" title="Feed ausblenden">×</button></h2>
  <div class="liste" id="feed"></div>
  <div class="glaube" id="glaube"></div>
  <div class="debug" id="debug">
    <h3>Debug · Werte &amp; Zeit</h3>
    <div class="devctl">
      <label>Körper <input type="range" id="s-body" min="0" max="100" step="1"><span id="v-body">–</span></label>
      <label>Psyche <input type="range" id="s-psyche" min="-100" max="100" step="1"><span id="v-psyche">–</span></label>
      <label>Hunger <input type="range" id="s-hunger" min="0" max="100" step="1"><span id="v-hunger">–</span></label>
      <label>Temperatur <input type="range" id="s-thermo" min="-100" max="100" step="1"><span id="v-thermo">–</span></label>
      <label>Drang <input type="range" id="s-drang" min="-100" max="100" step="1"><span id="v-drang">–</span></label>
      <label>Halt <input type="range" id="s-halt" min="0" max="100" step="1"><span id="v-halt">–</span></label>
      <div class="speed">Zeit
        <button data-speed="1" aria-pressed="true">×1</button>
        <button data-speed="3" aria-pressed="false">×3</button>
        <button data-speed="10" aria-pressed="false">×10</button>
      </div>
    </div>
    <h3 style="margin-top:10px">Debug-Log · alle Entscheidungen</h3>
    <div id="debugliste"></div>
  </div>
</aside>

<nav class="cam" id="cam">
  <button data-mode="charakter" aria-pressed="true">1 · Charakter</button>
  <button data-mode="planet" aria-pressed="false">2 · Planet</button>
  <button id="feedAn" aria-pressed="false" title="Feed ein-/ausblenden">Feed</button>
</nav>
<div class="hinweis" id="hinweis">ziehen = drehen · Rad = zoom</div>

<div class="bubble" id="bubble"></div>
<div class="fuss">Figuren und Texte werden von KI erzeugt.</div>

<script type="module" src="/scene.js"></script>
</body>
</html>
