<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14'>🐟</text></svg>">
<title>AIquarium · Hamburg St. Pauli</title>
<style>
  :root{
    --ink:#e9eef5; --mu:#93a1b5; --line:#22303f; --panel:rgba(9,13,19,.78);
    --amber:#f5b04c; --gruen:#7ee2a8; --himmel:#7ec8f5; --rot:#f27d7d;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0a0e13;color:var(--ink);font-family:var(--font);overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* HUD: bewusst minimal, 90 % freie Sicht */
  .hud{position:fixed;pointer-events:none;z-index:5}
  .oben{top:14px;left:16px;display:flex;flex-direction:column;gap:3px;max-width:min(46vw,420px)}
  .name{font-size:.95rem}
  .name b{font-weight:650}
  .sub{font-family:var(--mono);font-size:.68rem;color:var(--mu)}
  .sub .tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-right:5px}

  .werte{left:16px;bottom:16px;display:grid;gap:6px;width:236px}
  .balken{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:8px;font-size:.68rem;color:var(--mu)}
  .schiene{position:relative;height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
  .schiene i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
  .schiene .chunk{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.55)}
  .num{font-family:var(--mono);text-align:right;color:var(--ink)}
  .inv{margin-top:6px;font-size:.66rem;color:var(--mu);font-family:var(--mono);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;pointer-events:auto}

  nav.leiste{position:fixed;top:14px;right:16px;display:flex;gap:6px;z-index:7}
  nav.leiste button{font:inherit;font-size:.74rem;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer}
  nav.leiste button:hover{border-color:var(--amber);color:var(--amber)}
  nav.leiste button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#14100a;font-weight:650}
  .devbadge{display:none;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
    color:#04121b;background:var(--himmel);border-radius:4px;padding:2px 6px;font-weight:700}
  .devbadge.an{display:inline-block;margin-left:8px;vertical-align:2px}

  .feed{position:fixed;top:62px;right:16px;width:320px;max-height:calc(100% - 170px);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px;z-index:6;overflow-y:auto;scrollbar-width:thin}
  .feed[hidden]{display:none}
  .feed h2{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin-bottom:8px}
  .feed .liste{display:grid;gap:6px}
  .eintrag{border-left:2px solid var(--line);padding:3px 0 3px 8px;font-size:.75rem;line-height:1.35}
  .eintrag small{display:block;color:var(--mu);font-family:var(--mono);font-size:.6rem}
  .eintrag.gedanke{border-color:var(--himmel)}
  .eintrag.traum{border-color:#9b7bf0}
  .eintrag.job{border-color:var(--gruen)}
  .eintrag.warnung{border-color:var(--rot)}
  /* Debug-Kasten (nur Dev-Modus ?mode=dev): aufklappbar, rawResponse scrollbar */
  .dbg{margin-top:6px;border:1px dashed var(--line);border-radius:8px;padding:4px 8px;font-size:.68rem}
  .dbg summary{cursor:pointer;color:var(--himmel);font-family:var(--mono);font-size:.64rem}
  .dbg-versuch{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
  .dbg-versuch pre{max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    background:rgba(255,255,255,.06);border-radius:6px;padding:6px;font-size:.62rem;font-family:var(--mono)}

  .blase{position:fixed;transform:translate(-50%,-100%);max-width:280px;background:#eef3f9;color:#0b0e13;
    border-radius:10px;padding:7px 11px;font-size:.78rem;line-height:1.35;z-index:8;display:none;
    box-shadow:0 6px 20px rgba(0,0,0,.4);pointer-events:none}
  .blase:after{content:"";position:absolute;left:20px;bottom:-6px;border:6px solid transparent;border-top-color:#eef3f9}

  .cam{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;
    background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px;z-index:7}
  .cam button{font:inherit;font-size:.72rem;color:var(--mu);background:transparent;border:0;
    padding:6px 12px;border-radius:99px;cursor:pointer}
  .cam button:hover{color:var(--ink)}
  .cam button[aria-pressed="true"]{background:var(--ink);color:#0b0e13;font-weight:600}
  .hinweis{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);font-size:.62rem;
    color:#7b8a9e;font-family:var(--mono);z-index:6;pointer-events:none}


  .gehirn{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,7,11,.66)}
  .gehirn[hidden]{display:none}
  .kasten{width:min(860px,94vw);max-height:88vh;background:#0d131b;border:1px solid var(--line);
    border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .kasten header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .kasten header h2{font-size:.9rem;flex:1}
  .kasten header button{background:transparent;border:1px solid var(--line);color:var(--mu);
    border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.75rem}
  .reiter{display:flex;gap:4px;padding:8px 12px 0}
  .reiter button{font:inherit;font-size:.72rem;color:var(--mu);background:transparent;border:0;
    border-bottom:2px solid transparent;padding:7px 10px;cursor:pointer}
  .reiter button[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber);font-weight:650}
  .inhalt{padding:14px 16px;overflow-y:auto;font-size:.8rem;line-height:1.5}
  .inhalt h3{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin:12px 0 6px}
  .inhalt h3:first-child{margin-top:0}
  .karte{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
  .gruen{border-left:3px solid var(--gruen)}
  .gelb{border-left:3px solid var(--amber)}
  .rot{border-left:3px solid var(--rot)}
  .raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .slot{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:.7rem}
  .slot.first{border-color:var(--rot);border-style:dashed}
  .slot .w{font-family:var(--mono);color:var(--mu);font-size:.62rem}
  .zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fortschritt{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-top:4px}
  .fortschritt i{display:block;height:100%;background:var(--gruen)}
  .devBox{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:none;gap:6px}
  .devBox.an{display:flex}
  .devBox button{font:inherit;font-size:.72rem;background:transparent;color:var(--himmel);
    border:1px solid var(--himmel);border-radius:8px;padding:6px 12px;cursor:pointer}

  .fuss{position:fixed;bottom:8px;right:14px;font-size:.6rem;color:#546274;z-index:5}
  @media(max-width:820px){
    .feed{width:calc(100% - 32px);max-height:30%;top:auto;bottom:100px;left:16px;right:16px}
    .werte{width:170px;bottom:100px}
    .zwei{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud oben">
  <div class="name"><b id="tName">Kiezling</b><span class="devbadge" id="devBadge">dev</span></div>
  <div class="sub" id="tUhr">verbinde …</div>
  <div class="sub" id="tOrt"></div>
</div>

<div class="hud werte">
  <div class="balken"><span>Gesund</span><div class="schiene" id="sGesund"><i id="bGesund" style="background:var(--gruen);width:100%"></i></div><span class="num" id="nGesund">–</span></div>
  <div class="balken"><span>Froh</span><div class="schiene"><i id="bFroh" style="background:var(--himmel);width:50%"></i></div><span class="num" id="nFroh">–</span></div>
  <div class="balken"><span>Hunger</span><div class="schiene"><i id="bHunger" style="background:var(--amber);width:20%"></i></div><span class="num" id="nHunger">–</span></div>
  <div class="balken"><span>Müde</span><div class="schiene"><i id="bMued" style="background:#9b7bf0;width:15%"></i></div><span class="num" id="nMued">–</span></div>
  <div class="balken"><span>Geld</span><div class="schiene"><i id="bGeld" style="background:var(--gruen);width:18%"></i></div><span class="num" id="nGeld">–</span></div>
  <div class="inv" id="tInv">Taschen: …</div>
</div>

<nav class="leiste">
  <button id="btnFeed" aria-pressed="true">Feed</button>
  <button id="btnGehirn">Gehirn</button>
</nav>

<aside class="feed" id="feedPanel">
  <h2>Live-Feed</h2>
  <div class="liste" id="feed"></div>
</aside>

<div class="blase" id="blase"></div>

<div class="cam" id="camBtns">
  <button data-cam="pilot" aria-pressed="true">Charakter</button>
  <button data-cam="overview" aria-pressed="false">Kiez</button>
</div>
<div class="hinweis" id="hinweis">ziehen = drehen · Rad = zoom · weit raus = Kiez-Blick</div>

<div class="gehirn" id="gehirn" hidden>
  <div class="kasten" role="dialog" aria-label="Gehirn">
    <header><h2>Gehirn</h2><button id="btnGehirnZu">schließen ×</button></header>
    <div class="reiter" role="tablist">
      <button role="tab" data-tab="kopf" aria-selected="true">Jetzt im Kopf</button>
      <button role="tab" data-tab="wesen" aria-selected="false">Character Sheet</button>
      <button role="tab" data-tab="gedaechtnis" aria-selected="false">Gedächtnis &amp; Bücher</button>
      <button role="tab" data-tab="chronik" aria-selected="false">Chronik</button>
    </div>
    <div class="inhalt" id="gehirnInhalt">lädt …</div>
  </div>
</div>

<div class="fuss">St. Pauli · Gebäude: FHH/LGV (dl-de/by-2.0) · Bäume: FHH/BUKA (dl-de/by-2.0) · KI-Figur</div>

<script type="module" src="/scene.js"></script>
</body>
</html>
